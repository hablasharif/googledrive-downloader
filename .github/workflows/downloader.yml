name: Google Drive Batch & Folder Downloader

on:
  # 1. Manual trigger from GitHub Actions tab with optional parameters
  workflow_dispatch:
    inputs:
      urls:
        description: 'Google Drive Links (Single files, Folder URLs, or multiple links separated by newlines)'
        required: false
        type: string
        default: ''
      max_workers:
        description: 'Number of parallel worker threads'
        required: false
        type: string
        default: '4'
      upload_artifact:
        description: 'Upload downloaded files as workflow artifact'
        required: true
        type: boolean
        default: true
      commit_failed_log:
        description: 'Commit download_failed.txt back to repo if any links fail'
        required: true
        type: boolean
        default: true
      retention_days:
        description: 'Artifact retention in days (1-90)'
        required: false
        type: string
        default: '7'

  # 2. Automatically run whenever config.yml is pushed/updated on main branch
  push:
    branches:
      - main
      - master
    paths:
      - 'config.yml'

jobs:
  download-files:
    name: Download Google Drive Files & Folders
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to commit download_failed.txt to the repository

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Downloader with Auto-Retry
        env:
          INPUT_URLS: ${{ github.event.inputs.urls }}
          MAX_WORKERS: ${{ github.event.inputs.max_workers || '4' }}
        run: |
          mkdir -p ./downloads

          if [ -n "$INPUT_URLS" ]; then
            echo "Processing manual URLs from workflow_dispatch..."
            printf "%s\n" "$INPUT_URLS" > input_urls.txt
            python downloader.py \
              --file-list input_urls.txt \
              --workers "$MAX_WORKERS" \
              --output ./downloads \
              --failed-log download_failed.txt \
              --no-progress
          else
            echo "Running download using config.yml..."
            python downloader.py \
              --config config.yml \
              --output ./downloads \
              --failed-log download_failed.txt \
              --no-progress
          fi

      - name: Inspect Download Results & Failed URLs
        run: |
          echo "=========================================="
          echo "Downloaded Files Directory Tree:"
          echo "=========================================="
          ls -lhR ./downloads

          if [ -s download_failed.txt ]; then
            echo "=========================================="
            echo "WARNING: PERSISTENT FAILED DOWNLOADS FOUND"
            echo "=========================================="
            cat download_failed.txt

            # Append to GitHub Actions step summary
            echo "### ⚠️ Persistent Failed Downloads" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat download_failed.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "All downloads succeeded without persistent errors."
            echo "### ✅ All Downloads Completed Successfully!" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Commit download_failed.txt to Main Repository
        if: ${{ github.event.inputs.commit_failed_log != 'false' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -s download_failed.txt ]; then
            echo "Committing download_failed.txt to repository branch..."
            git add download_failed.txt
            git commit -m "chore: record failed download links in download_failed.txt [skip ci]" || echo "No changes to commit."
            git push origin HEAD:${{ github.ref_name }} || echo "Failed to push to branch."
          else
            if git ls-files --error-unmatch download_failed.txt >/dev/null 2>&1; then
              echo "Removing old resolved download_failed.txt from repository..."
              git rm download_failed.txt
              git commit -m "chore: remove resolved download_failed.txt [skip ci]" || echo "No changes to commit."
              git push origin HEAD:${{ github.ref_name }} || echo "Failed to push to branch."
            fi
          fi

      - name: Upload Downloaded Files and Logs as Artifacts
        if: ${{ github.event.inputs.upload_artifact != 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: google-drive-downloads-${{ github.run_id }}
          path: |
            ./downloads/
            download_failed.txt
          retention-days: ${{ github.event.inputs.retention_days || 7 }}
