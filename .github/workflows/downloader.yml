name: Google Drive Batch Downloader & Auto-Uploader

on:
  # 1. Manual trigger from GitHub Actions tab with parameters
  workflow_dispatch:
    inputs:
      urls:
        description: 'Google Drive Links (Single files, Folder URLs, or multiple links separated by newlines)'
        required: false
        type: string
        default: ''
      destination_folder_id:
        description: 'Optional Google Drive Destination Folder ID (leave empty for My Drive root)'
        required: false
        type: string
        default: ''
      upload_to_gdrive:
        description: 'Upload downloaded files directly to your Google Drive'
        required: true
        type: boolean
        default: true
      upload_artifact:
        description: 'Upload downloaded files as GitHub Actions workflow artifact (ZIP)'
        required: true
        type: boolean
        default: true
      max_workers:
        description: 'Number of parallel download worker threads'
        required: false
        type: string
        default: '4'

  # 2. Automatically run whenever config.yml is pushed/updated on main branch
  push:
    branches:
      - main
      - master
    paths:
      - 'config.yml'

jobs:
  download-and-upload:
    name: Download & Upload to Google Drive
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Downloader
        env:
          INPUT_URLS: ${{ github.event.inputs.urls }}
          MAX_WORKERS: ${{ github.event.inputs.max_workers || '4' }}
        run: |
          mkdir -p ./downloads

          if [ -n "$INPUT_URLS" ]; then
            echo "Processing manual URLs from workflow_dispatch..."
            printf "%s\n" "$INPUT_URLS" > input_urls.txt
            python downloader.py \
              --file-list input_urls.txt \
              --workers "$MAX_WORKERS" \
              --output ./downloads \
              --failed-log download_failed.txt \
              --no-progress || true
          else
            echo "Running download using config.yml..."
            python downloader.py \
              --config config.yml \
              --output ./downloads \
              --failed-log download_failed.txt \
              --no-progress || true
          fi

      - name: Inspect Downloaded Files
        run: |
          echo "=========================================="
          echo "Downloaded Files Directory Tree:"
          echo "=========================================="
          ls -lhR ./downloads

      # Upload files directly to Google Drive via upload_drive.py
      - name: Upload Downloaded Files to Google Drive
        if: ${{ github.event.inputs.upload_to_gdrive != 'false' }}
        env:
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_TOKEN_JSON: ${{ secrets.GDRIVE_TOKEN_JSON }}
          DESTINATION_FOLDER_ID: ${{ github.event.inputs.destination_folder_id }}
          CI: "true"
        run: |
          python upload_drive.py --dir ./downloads

      - name: Upload Workflow Artifact (Backup)
        if: ${{ github.event.inputs.upload_artifact != 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: google-drive-downloads-${{ github.run_id }}
          path: ./downloads/
          retention-days: 7
