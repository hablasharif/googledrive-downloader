name: Google Drive Batch Downloader

on:
  # 1. Manual trigger from GitHub Actions tab with optional parameters
  workflow_dispatch:
    inputs:
      urls:
        description: 'Google Drive Links (one URL or ID per line, or leave empty to use config.yml)'
        required: false
        type: string
        default: ''
      max_workers:
        description: 'Number of parallel worker threads'
        required: false
        type: string
        default: '4'
      upload_artifact:
        description: 'Upload downloaded files as workflow artifact'
        required: true
        type: boolean
        default: true
      retention_days:
        description: 'Artifact retention in days (1-90)'
        required: false
        type: string
        default: '7'

  # 2. Automatically run whenever config.yml is pushed/updated on main branch
  push:
    branches:
      - main
      - master
    paths:
      - 'config.yml'

jobs:
  download-files:
    name: Download Google Drive Files
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Downloader
        run: |
          mkdir -p ./downloads

          # Check if manual URLs were supplied via workflow_dispatch
          if [ -n "${{ github.event.inputs.urls }}" ]; then
            echo "Running download using workflow_dispatch URL inputs..."
            python downloader.py \
              --urls ${{ github.event.inputs.urls }} \
              --workers ${{ github.event.inputs.max_workers }} \
              --output ./downloads \
              --no-progress
          else
            echo "Running download using config.yml..."
            python downloader.py \
              --config config.yml \
              --output ./downloads \
              --no-progress
          fi

      - name: Check Downloaded Files
        run: |
          echo "Downloaded files list:"
          ls -lhR ./downloads

      - name: Upload Downloaded Files as Artifacts
        if: ${{ github.event.inputs.upload_artifact != 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: google-drive-downloads-${{ github.run_id }}
          path: ./downloads/
          retention-days: ${{ github.event.inputs.retention_days || 7 }}
